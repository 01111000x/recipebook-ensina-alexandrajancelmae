{% extends 'ledger/base.html' %}

{% block content %}
<h2>{{ name }}</h2>
<h3>Ingredients:</h3>
<ul>
    {% for recipe_ingredient in recipe.ingredients.all %}
        <li>{{ recipe_ingredient.quantity }} of {{ recipe_ingredient.ingredient.name }}</li>
    {% empty %}
		<li>No ingredients added yet.</li>
	{% endfor %}
</ul>
{% endblock %}
