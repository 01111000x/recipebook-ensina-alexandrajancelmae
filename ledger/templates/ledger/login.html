{% extends 'ledger/base.html' %}

{% block page_title %}Login{% endblock %}

{% block content %}
<h3>Please log in</h3>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Login</button>
</form>
<p><a href="{% url 'password_reset' %}">Forgot password?</a></p>
{% endblock %}
