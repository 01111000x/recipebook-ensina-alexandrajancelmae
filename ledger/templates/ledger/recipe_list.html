{% extends 'ledger/base.html' %}

{% block content %}
<h2>Recipes List</h2>
<ul>
    {% for recipe in recipes %}
        <li><a href="{{ recipe.get_absolute_url }}">{{ recipe.name }}</a></li>
    {% empty %}
        <li>No recipes available.</li>
    {% endfor %}
</ul>
<p><a href="{% url 'recipe_add' %}">Add New Recipe</a></p>
{% endblock %}
